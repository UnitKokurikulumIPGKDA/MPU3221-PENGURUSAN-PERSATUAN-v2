<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk | MPU3221</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0c; --cyan: #00f2ff; --border: #1e1e24; --text: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        body::before { content: ""; position: absolute; width: 100%; height: 100%; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 40px 40px; z-index: -1; opacity: 0.2; }
        .login-card { width: 100%; max-width: 400px; padding: 3rem; background: rgba(15, 15, 18, 0.9); border: 1px solid var(--border); backdrop-filter: blur(10px); position: relative; }
        .login-card::before { content: "DATA_ACCESS_v1.0"; position: absolute; top: 10px; right: 15px; font-family: 'JetBrains Mono'; font-size: 0.6rem; color: var(--cyan); }
        h1 { font-size: 1.5rem; letter-spacing: 2px; color: var(--cyan); margin-bottom: 2rem; border-left: 3px solid var(--cyan); padding-left: 15px; }
        label { display: block; font-family: 'JetBrains Mono'; font-size: 0.7rem; color: #888; margin-bottom: 10px; }
        input { width: 100%; padding: 1rem; background: transparent; border: 1px solid var(--border); color: white; font-family: 'JetBrains Mono'; margin-bottom: 1.5rem; }
        input:focus { outline: none; border-color: var(--cyan); background: rgba(0, 242, 255, 0.05); }
        button { width: 100%; padding: 1rem; background: var(--cyan); color: #000; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        #err { color: #ff4d4d; font-family: 'JetBrains Mono'; font-size: 0.7rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>PORTAL MPU3221</h1>
        <label>NO. KAD PENGENALAN</label>
        <input type="text" id="noKP" placeholder="Masukkan 12 Digit" maxlength="12">
        <button onclick="login()">Authenticate</button>
        <p id="err"></p>
    </div>
    <script>
        const API = "https://script.google.com/macros/s/AKfycbxyt0-pomCxkk56f5K2Udb-agKG2DaXbyToZ_3sKIFzzU_1k1YuzvHtTtvhDd8BfSV8Dg/exec";
        async function login() {
            const kp = document.getElementById('noKP').value;
            const err = document.getElementById('err');
            if(kp.length < 12) { err.textContent = "Err: Masukkan 12 digit"; err.style.display = 'block'; return; }
            
            try {
                const res = await fetch(`${API}?action=checkLogin&noKP=${kp}`);
                const out = await res.json();
                if(out.status === "success") {
                    localStorage.setItem('userMPU', JSON.stringify(out.data));
                    window.location.href = "profile.html";
                } else {
                    err.textContent = "Err: " + out.message;
                    err.style.display = 'block';
                }
            } catch(e) { err.textContent = "Err: Server Offline"; err.style.display = 'block'; }
        }
    </script>
</body>
</html>
