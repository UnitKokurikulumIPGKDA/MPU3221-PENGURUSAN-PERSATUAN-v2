<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal MPU3221 | STABLE REPAIR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; min-height: 100vh; color: white; display: flex; align-items: center; justify-content: center; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2.5rem; }
        .btn-prime { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: 0.3s; }
        .hidden-section { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* FIX: Gaya untuk placeholder gambar */
        .img-placeholder {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 8px; opacity: 0.3;
        }
        .img-placeholder i { font-size: 2rem; }
        .img-placeholder p { font-size: 10px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body class="p-4">

    <div id="loginScreen" class="glass w-full max-w-md p-10 shadow-2xl">
        <h1 class="text-4xl font-extrabold text-center mb-10 text-indigo-400">Portal MPU3221</h1>
        <div class="flex gap-2 mb-8 p-1 bg-white/5 rounded-2xl text-[10px] font-bold">
            <button onclick="setType('student')" id="ts" class="flex-1 py-3 rounded-xl bg-indigo-600 transition-all">PELAJAR</button>
            <button onclick="setType('lecturer')" id="tl" class="flex-1 py-3 rounded-xl transition-all">PENSYARAH</button>
        </div>
        <div id="loginFields" class="space-y-4">
            <input type="text" id="idIn" placeholder="No. Kad Pengenalan / Emel" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-indigo-500 font-mono text-center">
            <input type="password" id="pwIn" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none hidden text-center">
        </div>
        <button onclick="handleAuth()" id="loginBtn" class="btn-prime w-full p-4 rounded-2xl font-bold uppercase mt-8 text-sm shadow-xl">MASUK SISTEM</button>
    </div>

    <div id="studentDash" class="glass w-full max-w-4xl p-8 hidden-section shadow-2xl">
        <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-5 font-bold italic">
            <h2 class="text-indigo-400 uppercase tracking-widest">Student_Dashboard</h2>
            <button onclick="logout()" class="px-5 py-2 border border-white/10 rounded-full text-[10px] font-black uppercase">LOGOUT</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="bg-white/5 p-8 rounded-[2rem] space-y-6 text-sm">
                <h3 class="text-[10px] font-black text-indigo-400 uppercase tracking-widest border-b border-white/5 pb-2">Profil Digital</h3>
                <div><p class="opacity-40 uppercase text-[9px]">Nama Penuh</p><p id="sN" class="text-lg font-semibold">--</p></div>
                <div><p class="opacity-40 uppercase text-[9px]">No. Kad Pengenalan</p><p id="sK" class="font-mono text-indigo-200">--</p></div>
                <div><p class="opacity-40 uppercase text-[9px]">Kelas</p><p id="sC" class="font-bold text-lg">--</p></div>
                <div><p class="opacity-40 uppercase text-[9px]">Status</p><p id="sS" class="text-orange-400 font-bold uppercase">PENDING</p></div>
            </div>
            <div class="space-y-4">
                <!-- FIX: Container gambar dengan ID untuk mudah dikawal -->
                <div id="imgContainer" class="w-full aspect-video rounded-3xl overflow-hidden bg-black/20 border border-white/10 flex items-center justify-center relative">
                    <img id="sImg" class="w-full h-full object-cover hidden" alt="Gambar Pelajar">
                    <div id="sPl" class="img-placeholder">
                        <i class="fas fa-image"></i>
                        <p>Tiada Fail Dikesan</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="document.getElementById('fIn').click()" class="bg-white/5 border border-white/10 p-3 rounded-2xl text-[10px] font-bold">FAIL</button>
                    <button onclick="hUp()" id="uploadBtn" class="btn-prime p-3 rounded-2xl text-[10px] font-bold shadow-lg">UPLOAD</button>
                </div>
                <input type="file" id="fIn" hidden accept="image/*" onchange="pImg(this)">
            </div>
        </div>
    </div>

    <div id="lecturerDash" class="glass w-full max-w-6xl p-8 hidden-section">
        <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-5 font-bold text-indigo-400 italic">
            <h2>LECTURER_PORTAL</h2>
            <button onclick="logout()" class="px-5 py-2 border border-white/10 rounded-full text-[10px]">LOGOUT</button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 text-sm">
            <div class="lg:col-span-4 h-[550px] overflow-y-auto custom-scroll pr-3" id="sList"></div>
            <div id="gradingPanel" class="lg:col-span-8 bg-white/5 border border-white/10 rounded-[2.5rem] p-10 hidden">
                <div class="flex items-center gap-6 mb-10 bg-white/5 p-5 rounded-3xl">
                    <!-- FIX: Wrapper gambar lecturer dengan fallback -->
                    <div id="liContainer" class="w-24 h-32 rounded-xl border border-white/20 shadow-xl overflow-hidden bg-white/5 flex items-center justify-center flex-shrink-0">
                        <img id="li" class="w-full h-full object-cover hidden" alt="Gambar Pelajar">
                        <i id="liPlaceholder" class="fas fa-user text-white/20 text-3xl"></i>
                    </div>
                    <div>
                        <h3 id="ln" class="text-2xl font-bold tracking-tight">--</h3>
                        <p id="lk" class="text-[10px] font-mono text-indigo-400 uppercase tracking-widest">--</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-6 text-center">
                    <div class="space-y-4 p-5 bg-white/5 rounded-2xl border border-white/10">
                        <h4 class="text-[11px] font-black text-indigo-400 uppercase border-b border-white/5">HPK1 (40%)</h4>
                        <input type="number" id="h1" placeholder="HP1 (30)" oninput="calc()" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none">
                        <input type="number" id="h5" placeholder="HP5 (10)" oninput="calc()" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none">
                    </div>
                    <div class="space-y-4 p-5 bg-white/5 rounded-2xl border border-white/10 text-center">
                        <h4 class="text-[11px] font-black text-indigo-400 uppercase border-b border-white/5">HPK2 (60%)</h4>
                        <input type="number" id="h8" placeholder="HP8 (30)" oninput="calc()" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none">
                        <input type="number" id="h10" placeholder="HP10 (30)" oninput="calc()" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none">
                    </div>
                </div>
                <div class="flex justify-between items-center bg-indigo-600/20 p-8 rounded-3xl border border-indigo-500/30 mb-8 text-center">
                    <div><p class="text-[10px] font-black uppercase opacity-40">Markah & Gred</p><p id="tm" class="text-5xl font-black text-indigo-400">0.0</p></div>
                    <p id="gd" class="text-6xl font-black text-indigo-400">F</p>
                </div>
                <div id="justArea" class="hidden mb-8 space-y-3">
                    <p class="text-[11px] font-bold text-red-400 uppercase tracking-widest">Justifikasi A+ Mandatori</p>
                    <textarea id="justTxt" oninput="validate()" rows="3" placeholder="..." class="w-full bg-red-500/5 border border-red-500/20 p-4 rounded-xl outline-none"></textarea>
                </div>
                <button onclick="save()" id="saveBtn" class="btn-prime w-full p-5 rounded-3xl font-extrabold uppercase shadow-2xl">SIMPAN MARKAH</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxufZgAB9OWBbVzGzBascudDu498uJB80q9PtWDAFWLzDCZD5MxYqGKvIRyC38JgkId1Q/exec";
        let mode = 'student', sData = [], curS = null;

        // =====================================================================
        // FIX 1: Fungsi pembetulan URL Google Drive yang lebih robust
        // Menyokong pelbagai format URL Drive dan menggunakan thumbnail API
        // =====================================================================
        function fixDriveUrl(url) {
            if (!url || url === "") return "";
            let fileId = "";

            // Format: .../d/{fileId}/...
            const matchD = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (matchD) fileId = matchD[1];

            // Format: ...id={fileId}...
            if (!fileId) {
                const matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (matchId) fileId = matchId[1];
            }

            // Format: .../open?id={fileId} atau uc?id=
            if (!fileId) {
                const matchUc = url.match(/\/uc\?.*id=([a-zA-Z0-9_-]+)/);
                if (matchUc) fileId = matchUc[1];
            }

            if (!fileId) return url; // Kembalikan URL asal jika tidak dapat extract ID

            // Gunakan Google Drive thumbnail API - format paling stabil untuk <img>
            return `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
        }

        // =====================================================================
        // FIX 2: Fungsi paparan gambar dengan fallback onerror
        // Jika URL gagal, cuba format uc?export=view sebagai alternatif
        // =====================================================================
        function loadImage(imgEl, placeholderEl, url) {
            if (!url || url === "") {
                imgEl.classList.add('hidden');
                placeholderEl.classList.remove('hidden');
                return;
            }

            const fixedUrl = fixDriveUrl(url);

            imgEl.onload = function() {
                imgEl.classList.remove('hidden');
                placeholderEl.classList.add('hidden');
            };

            imgEl.onerror = function() {
                // FIX: Cuba format alternatif jika thumbnail gagal
                const fileId = fixedUrl.match(/id=([a-zA-Z0-9_-]+)/)?.[1];
                if (fileId && !imgEl.dataset.retried) {
                    imgEl.dataset.retried = "1";
                    imgEl.src = `https://lh3.googleusercontent.com/d/${fileId}`;
                } else {
                    // Fallback terakhir: tunjuk placeholder
                    imgEl.classList.add('hidden');
                    placeholderEl.classList.remove('hidden');
                }
            };

            imgEl.src = fixedUrl;
        }

        function setType(t) {
            mode = t;
            document.getElementById('ts').classList.toggle('bg-indigo-600', t === 'student');
            document.getElementById('tl').classList.toggle('bg-indigo-600', t === 'lecturer');
            document.getElementById('pwIn').classList.toggle('hidden', t === 'student');
        }

        async function handleAuth() {
            const id = document.getElementById('idIn').value.trim();
            const pw = document.getElementById('pwIn').value;
            if (!id) return alert("Sila masukkan maklumat!");
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.innerHTML = "VERIFYING...";

            try {
                if (mode === 'student') {
                    const r = await fetch(`${API}?action=checkLogin&noKP=${encodeURIComponent(id)}`);
                    const o = await r.json();
                    if (o.status === "success") {
                        localStorage.setItem('userMPU', JSON.stringify(o.data));
                        renderS(o.data);
                    } else {
                        alert(o.message);
                    }
                } else {
                    const r = await fetch(`${API}?action=lecturerLogin&email=${encodeURIComponent(id)}&pass=${encodeURIComponent(pw)}`);
                    const o = await r.json();
                    if (o.status === "success") {
                        localStorage.setItem('le', id);
                        initL(id);
                    } else if (o.status === "new_user") {
                        alert("Akaun baru. Sila hubungi pentadbir untuk mendaftar.");
                    } else {
                        alert(o.message);
                    }
                }
            } catch (e) {
                alert("API Connection Error: " + e.message);
            }
            btn.disabled = false; btn.innerHTML = "MASUK SISTEM";
        }

        function renderS(d) {
            document.getElementById('loginScreen').classList.add('hidden-section');
            document.getElementById('studentDash').classList.remove('hidden-section');
            document.getElementById('sN').textContent = d.Nama_Pelajar || '--';
            document.getElementById('sK').textContent = d.No_KP || '--';
            document.getElementById('sC').textContent = d.Kelas || '--';

            if (d.Status_Upload === "Selesai") {
                document.getElementById('sS').textContent = "✓ SELESAI";
                document.getElementById('sS').className = "text-green-400 font-bold uppercase text-[10px]";
            }

            // FIX 3: Guna fungsi loadImage yang betul dengan fallback
            const imgEl = document.getElementById('sImg');
            const plEl = document.getElementById('sPl');

            if (d.Link_Gambar && d.Link_Gambar !== "") {
                loadImage(imgEl, plEl, d.Link_Gambar);
            }
        }

        async function initL(em) {
            document.getElementById('loginScreen').classList.add('hidden-section');
            document.getElementById('lecturerDash').classList.remove('hidden-section');
            try {
                const r = await fetch(`${API}?action=getLecturerStudents&email=${encodeURIComponent(em)}`);
                const o = await r.json();
                sData = o.data || [];
                renderStudentList();
            } catch (e) {
                alert("Gagal memuatkan data pelajar: " + e.message);
            }
        }

        function renderStudentList() {
            document.getElementById('sList').innerHTML = sData.map(s => `
                <div onclick="sel('${s.No_KP}')" class="p-5 bg-white/5 border border-white/10 rounded-2xl mb-4 cursor-pointer hover:bg-indigo-500/10 transition-all border-l-4 border-l-transparent hover:border-l-indigo-400">
                    <p class="font-bold text-sm text-indigo-100">${s.Nama_Pelajar}</p>
                    <p class="text-[9px] opacity-40 uppercase font-mono tracking-widest">${s.Kelas} | ${s.No_KP}</p>
                    ${s.markahSediaAda ? '<p class="text-[9px] text-green-400 mt-1">✓ Markah tersimpan</p>' : ''}
                </div>
            `).join('');
        }

        function sel(kp) {
            curS = sData.find(s => s.No_KP == kp);
            if (!curS) return;

            document.getElementById('gradingPanel').classList.remove('hidden');
            document.getElementById('ln').textContent = curS.Nama_Pelajar;
            document.getElementById('lk').textContent = `KP: ${curS.No_KP} | ${curS.Kelas}`;

            // FIX 4: Guna fungsi loadImage untuk gambar di panel lecturer
            const li = document.getElementById('li');
            const liPh = document.getElementById('liPlaceholder');
            loadImage(li, liPh, curS.Link_Gambar);

            if (curS.markahSediaAda) {
                document.getElementById('h1').value = curS.markahSediaAda.hp1 || '';
                document.getElementById('h5').value = curS.markahSediaAda.hp5 || '';
                document.getElementById('h8').value = curS.markahSediaAda.hp8 || '';
                document.getElementById('h10').value = curS.markahSediaAda.hp10 || '';
                document.getElementById('justTxt').value = (curS.markahSediaAda.just === "-" || !curS.markahSediaAda.just) ? "" : curS.markahSediaAda.just;
            } else {
                ['h1', 'h5', 'h8', 'h10', 'justTxt'].forEach(i => document.getElementById(i).value = '');
            }
            calc();
        }

        function calc() {
            const h = [
                Number(document.getElementById('h1').value) || 0,
                Number(document.getElementById('h5').value) || 0,
                Number(document.getElementById('h8').value) || 0,
                Number(document.getElementById('h10').value) || 0
            ];
            const t = h.reduce((a, b) => a + b, 0);
            document.getElementById('tm').textContent = t.toFixed(1);
            let g = "F";
            if (t >= 90) g = "A+"; else if (t >= 80) g = "A"; else if (t >= 75) g = "A-";
            else if (t >= 70) g = "B+"; else if (t >= 65) g = "B"; else if (t >= 60) g = "B-";
            else if (t >= 55) g = "C+"; else if (t >= 50) g = "C"; else if (t >= 40) g = "C-";
            else if (t >= 30) g = "D+"; else if (t >= 20) g = "D";
            document.getElementById('gd').textContent = g;
            document.getElementById('justArea').classList.toggle('hidden', g !== "A+");
            validate();
        }

        function validate() {
            const g = document.getElementById('gd').textContent;
            const j = document.getElementById('justTxt').value.trim();
            document.getElementById('saveBtn').disabled = (g === "A+" && j === "");
        }

        async function save() {
            const b = document.getElementById('saveBtn');
            b.disabled = true; b.textContent = "SEDANG MENYIMPAN...";
            const p = {
                action: "submitScores",
                noKP: curS.No_KP,
                hp1: Number(document.getElementById('h1').value) || 0,
                hp5: Number(document.getElementById('h5').value) || 0,
                hp8: Number(document.getElementById('h8').value) || 0,
                hp10: Number(document.getElementById('h10').value) || 0,
                justifikasi: document.getElementById('justTxt').value || "-",
                penilai: localStorage.getItem('le')
            };
            try {
                await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) });
                alert("MARKAH BERJAYA DISIMPAN!");
                // Refresh senarai pelajar
                const r = await fetch(`${API}?action=getLecturerStudents&email=${encodeURIComponent(localStorage.getItem('le'))}`);
                const o = await r.json();
                sData = o.data || [];
                renderStudentList();
            } catch (e) {
                alert("Ralat menyimpan markah: " + e.message);
            }
            b.disabled = false; b.innerHTML = "SIMPAN MARKAH";
        }

        // =====================================================================
        // FIX 5: Fungsi upload yang menunggu response sebelum refresh data
        // Tidak guna location.reload() — guna fetch API semula untuk refresh gambar
        // =====================================================================
        async function hUp() {
            const f = document.getElementById('fIn');
            if (!f.files[0]) return alert("Pilih fail dahulu!");

            const upBtn = document.getElementById('uploadBtn');
            upBtn.disabled = true;
            upBtn.textContent = "UPLOADING...";

            const u = JSON.parse(localStorage.getItem('userMPU'));

            try {
                const base64 = await fileToBase64(f.files[0]);
                const p = {
                    action: "uploadImage",
                    noKP: u.No_KP.toString(),
                    imageData: base64,
                    mimeType: f.files[0].type,
                    fileName: "MPU3221_" + u.No_KP
                };

                // Hantar upload (no-cors tidak boleh baca response, tapi data tersimpan)
                await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) });

                // FIX: Tunggu 2 saat untuk Drive proses fail, kemudian fetch semula data
                upBtn.textContent = "MEMPROSES...";
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Dapatkan data terkini dari server (termasuk URL gambar baru)
                const r = await fetch(`${API}?action=checkLogin&noKP=${encodeURIComponent(u.No_KP)}`);
                const o = await r.json();

                if (o.status === "success") {
                    // FIX: Kemas kini localStorage dengan data terbaru
                    localStorage.setItem('userMPU', JSON.stringify(o.data));
                    renderS(o.data);
                    alert("BERJAYA! Gambar telah dimuatnaik.");
                } else {
                    alert("Upload selesai. Sila refresh halaman untuk lihat gambar.");
                    location.reload();
                }
            } catch (e) {
                alert("Ralat upload: " + e.message);
            }

            upBtn.disabled = false;
            upBtn.textContent = "UPLOAD";
        }

        // Helper: tukar File kepada base64 string
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = e => resolve(e.target.result.split(',')[1]);
                r.onerror = () => reject(new Error("Gagal baca fail"));
                r.readAsDataURL(file);
            });
        }

        // Preview gambar sebelum upload
        function pImg(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById('sImg');
                    const pl = document.getElementById('sPl');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    pl.classList.add('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function logout() { localStorage.clear(); location.reload(); }

        // Auto-login jika session masih ada
        window.onload = () => {
            const u = localStorage.getItem('userMPU');
            if (u) {
                try { renderS(JSON.parse(u)); } catch(e) { localStorage.clear(); }
            }
            const le = localStorage.getItem('le');
            if (le) initL(le);
        };
    </script>
</body>
</html>
