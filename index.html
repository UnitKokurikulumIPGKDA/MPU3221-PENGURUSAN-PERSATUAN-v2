<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal MPU3221 | Rubrik Unified</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2rem; }
        .btn-prime { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .hidden-section { display: none; }
    </style>
</head>
<body class="p-4">

    <div id="loginScreen" class="glass w-full max-w-md p-10 shadow-2xl">
        <h1 class="text-3xl font-black text-center mb-8 uppercase text-indigo-400">Portal MPU3221</h1>
        <div class="flex gap-2 mb-6 p-1 bg-white/5 rounded-xl">
            <button onclick="setType('student')" id="ts" class="flex-1 py-2 rounded-lg text-[10px] font-bold bg-indigo-600">PELAJAR</button>
            <button onclick="setType('lecturer')" id="tl" class="flex-1 py-2 rounded-lg text-[10px] font-bold">PENSYARAH</button>
        </div>
        <div id="sF" class="space-y-4">
            <input type="text" id="kpIn" placeholder="No. Kad Pengenalan" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
        </div>
        <div id="lF" class="space-y-4 hidden">
            <input type="email" id="emIn" placeholder="Emel Pensyarah" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            <input type="password" id="pwIn" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm">
        </div>
        <button onclick="auth()" id="lb" class="btn-prime w-full p-4 rounded-2xl font-bold uppercase mt-6 text-sm">Masuk</button>
    </div>

    <div id="regScreen" class="glass w-full max-w-md p-10 hidden-section">
        <h2 class="text-xl font-bold mb-6 text-center text-indigo-400">PENDAFTARAN PENSYARAH</h2>
        <div class="space-y-4">
            <input type="text" id="rn" placeholder="Nama Penuh" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            <input type="password" id="rp" placeholder="Cipta Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            <button onclick="doReg()" class="btn-prime w-full p-4 rounded-2xl font-bold uppercase">Daftar Sekarang</button>
        </div>
    </div>

    <div id="lDash" class="glass w-full max-w-6xl p-8 hidden-section shadow-2xl">
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <h2 class="text-xl font-bold italic text-indigo-400 uppercase">Lecturer_Portal</h2>
            <button onclick="location.reload()" class="px-5 py-2 border border-white/10 rounded-full text-[10px] font-bold">LOGOUT</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 h-[550px] overflow-y-auto pr-2" id="sList"></div>

            <div id="gP" class="lg:col-span-8 bg-white/5 border border-white/10 rounded-3xl p-8 hidden">
                <div class="flex items-center gap-6 mb-8 bg-white/5 p-4 rounded-2xl">
                    <img id="li" class="w-24 h-28 object-cover rounded-xl border border-white/20">
                    <div>
                        <h3 id="ln" class="text-xl font-bold">--</h3>
                        <p id="lk" class="text-[10px] font-mono text-indigo-400 uppercase">--</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                    <div class="space-y-4 p-5 bg-white/5 rounded-2xl border border-white/10">
                        <h4 class="text-[11px] font-black text-indigo-400 uppercase border-b border-white/10 pb-2">Tugasan 1: Penulisan (40%)</h4>
                        <div>
                            <label class="text-[9px] opacity-40 uppercase tracking-widest">HP1 - Penulisan (30%)</label>
                            <input type="number" id="h1" oninput="calc()" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="text-[9px] opacity-40 uppercase tracking-widest">HP5 - Gaya & Format (10%)</label>
                            <input type="number" id="h5" oninput="calc()" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="space-y-4 p-5 bg-white/5 rounded-2xl border border-white/10">
                        <h4 class="text-[11px] font-black text-indigo-400 uppercase border-b border-white/10 pb-2">Tugasan 2: Penganjuran (60%)</h4>
                        <div>
                            <label class="text-[9px] opacity-40 uppercase tracking-widest">HP8 - Kumpulan (30%)</label>
                            <input type="number" id="h8" oninput="calc()" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="text-[9px] opacity-40 uppercase tracking-widest">HP10 - Individu (30%)</label>
                            <input type="number" id="h10" oninput="calc()" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center bg-indigo-600/20 p-6 rounded-2xl border border-indigo-500/30 mb-8">
                    <div>
                        <p class="text-[10px] font-black uppercase opacity-40 tracking-widest">Jumlah Markah Keseluruhan</p>
                        <p id="totalMark" class="text-4xl font-black text-indigo-400">0.0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-black uppercase opacity-40 tracking-widest">Gred</p>
                        <p id="gredDisplay" class="text-5xl font-black text-indigo-400">F</p>
                    </div>
                </div>

                <button onclick="save()" class="btn-prime w-full p-4 rounded-2xl font-bold uppercase tracking-widest shadow-xl transition-all">Simpan Pemarkahan Rubrik</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxufZgAB9OWBbVzGzBascudDu498uJB80q9PtWDAFWLzDCZD5MxYqGKvIRyC38JgkId1Q/exec";
        let mode = 'student';
        let sData = [];
        let curS = null;

        function setType(t) {
            mode = t;
            document.getElementById('ts').classList.toggle('bg-indigo-600', t === 'student');
            document.getElementById('tl').classList.toggle('bg-indigo-600', t === 'lecturer');
            document.getElementById('sF').classList.toggle('hidden', t === 'lecturer');
            document.getElementById('lF').classList.toggle('hidden', t === 'student');
        }

        async function auth() {
            if (mode === 'lecturer') {
                const em = document.getElementById('emIn').value;
                const pw = document.getElementById('pwIn').value;
                const r = await fetch(`${API}?action=lecturerLogin&email=${em}&pass=${pw}`);
                const o = await r.json();
                if(o.status === "success") { localStorage.setItem('le', em); initLec(em); }
                else if(o.status === "new_user") { document.getElementById('loginScreen').classList.add('hidden-section'); document.getElementById('regScreen').classList.remove('hidden-section'); }
                else alert(o.message);
            }
        }

        async function doReg() {
            const p = { action: "registerLecturer", email: document.getElementById('emIn').value, nama: document.getElementById('rn').value, pass: document.getElementById('rp').value };
            await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) });
            alert("Berjaya! Sila Masuk Semula."); location.reload();
        }

        async function initLec(em) {
            document.getElementById('loginScreen').classList.add('hidden-section');
            document.getElementById('lDash').classList.remove('hidden-section');
            const r = await fetch(`${API}?action=getLecturerStudents&email=${em}`);
            const o = await r.json();
            sData = o.data;
            document.getElementById('sList').innerHTML = sData.map(s => `
                <div onclick="sel('${s.No_KP}')" class="p-4 bg-white/5 border border-white/10 rounded-xl mb-3 cursor-pointer hover:bg-white/10 transition-all">
                    <p class="font-bold text-sm">${s.Nama_Pelajar}</p>
                    <p class="text-[9px] opacity-40 uppercase font-mono">${s.Kelas} | ${s.No_KP}</p>
                </div>
            `).join('');
        }

        function sel(kp) {
            curS = sData.find(s => s.No_KP == kp);
            document.getElementById('gP').classList.remove('hidden');
            document.getElementById('ln').textContent = curS.Nama_Pelajar;
            document.getElementById('lk').textContent = `${curS.Kelas} | KP: ${curS.No_KP}`;
            document.getElementById('li').src = curS.Link_Gambar || "https://via.placeholder.com/150";
            document.getElementById('h1').value = ''; document.getElementById('h5').value = '';
            document.getElementById('h8').value = ''; document.getElementById('h10').value = '';
            calc();
        }

        function calc() {
            const h = [Number(document.getElementById('h1').value), Number(document.getElementById('h5').value), Number(document.getElementById('h8').value), Number(document.getElementById('h10').value)];
            const total = h.reduce((a, b) => a + b, 0);
            document.getElementById('totalMark').textContent = total.toFixed(1);
            let g = "F";
            if (total >= 90) g = "A+"; else if (total >= 80) g = "A"; else if (total >= 75) g = "A-"; else if (total >= 70) g = "B+"; else if (total >= 65) g = "B"; else if (total >= 60) g = "B-"; else if (total >= 55) g = "C+"; else if (total >= 50) g = "C"; else if (total >= 40) g = "C-"; else if (total >= 30) g = "D+"; else if (total >= 20) g = "D";
            document.getElementById('gredDisplay').textContent = g;
        }

        async function save() {
            const h = [Number(document.getElementById('h1').value), Number(document.getElementById('h5').value), Number(document.getElementById('h8').value), Number(document.getElementById('h10').value)];
            const p = { action: "submitScores", noKP: curS.No_KP, hp1: h[0], hp5: h[1], hp8: h[2], hp10: h[3], total: h.reduce((a, b) => a + b, 0), penilai: localStorage.getItem('le') };
            await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) });
            alert("Markah Berjaya Disimpan!");
        }
    </script>
</body>
</html>
