<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal MPU3221 | Unified Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; min-height: 100vh; color: white; display: flex; align-items: center; justify-content: center; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2.5rem; }
        .btn-prime { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: 0.3s; }
        .btn-prime:disabled { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        .hidden-section { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="p-4">

    <div id="loginScreen" class="glass w-full max-w-md p-10 shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tighter uppercase text-indigo-400">Portal MPU3221</h1>
            <p class="text-white/40 text-[10px] font-bold tracking-[0.2em] mt-2 uppercase">Identity Authentication</p>
        </div>
        
        <div class="flex gap-2 mb-8 p-1 bg-white/5 rounded-2xl text-[10px] font-bold">
            <button onclick="setType('student')" id="ts" class="flex-1 py-3 rounded-xl bg-indigo-600 transition-all">
                <i class="fa-solid fa-user-graduate mr-2"></i>PELAJAR
            </button>
            <button onclick="setType('lecturer')" id="tl" class="flex-1 py-3 rounded-xl transition-all">
                <i class="fa-solid fa-chalkboard-user mr-2"></i>PENSYARAH
            </button>
        </div>

        <div id="loginFields" class="space-y-4">
            <div class="relative">
                <i class="fa-solid fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-white/20"></i>
                <input type="text" id="idIn" placeholder="No. KP / Emel Pensyarah" class="w-full bg-white/5 border border-white/10 p-4 pl-12 rounded-2xl outline-none focus:border-indigo-500 font-mono">
            </div>
            <div id="pwGroup" class="relative hidden">
                <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-white/20"></i>
                <input type="password" id="pwIn" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 pl-12 rounded-2xl outline-none focus:border-indigo-500">
            </div>
        </div>

        <button onclick="handleAuth()" id="loginBtn" class="btn-prime w-full p-4 rounded-2xl font-bold uppercase mt-8 text-sm tracking-widest">
            <span id="btTxt"><i class="fa-solid fa-right-to-bracket mr-2"></i>MASUK SISTEM</span>
        </button>
    </div>

    <div id="regScreen" class="glass w-full max-w-md p-10 hidden-section">
        <h2 class="text-xl font-bold mb-6 text-center text-indigo-400 uppercase tracking-widest underline">Daftar Pensyarah</h2>
        <div class="space-y-4">
            <input type="text" id="rn" placeholder="Nama Penuh" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            <input type="password" id="rp" placeholder="Cipta Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            <button onclick="doReg()" class="btn-prime w-full p-4 rounded-2xl font-bold uppercase tracking-widest shadow-lg">SAHKAN PENDAFTARAN</button>
        </div>
    </div>

    <div id="studentDash" class="glass w-full max-w-4xl p-8 hidden-section shadow-2xl">
        <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-5">
            <h2 class="text-xl font-bold italic"><i class="fa-solid fa-circle-user mr-2 text-indigo-400"></i>Student_Dashboard</h2>
            <button onclick="logout()" class="px-5 py-2 border border-white/10 rounded-full text-[10px] font-black uppercase hover:bg-red-500/20 transition-all">
                <i class="fa-solid fa-power-off mr-2"></i>LOGOUT
            </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="bg-white/5 p-8 rounded-[2rem] space-y-6">
                <h3 class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">Profil Digital</h3>
                <div><p class="text-[9px] opacity-40 uppercase">Nama Penuh</p><p id="sN" class="text-lg font-semibold">--</p></div>
                <div><p class="text-[9px] opacity-40 uppercase font-mono">No. Kad Pengenalan</p><p id="sK" class="font-mono text-indigo-200 text-sm">--</p></div>
                <div><p class="text-[9px] opacity-40 uppercase">Kelas</p><p id="sC" class="font-bold">--</p></div>
                <div><p class="text-[9px] opacity-40 uppercase">Status Bukti</p><p id="sS" class="text-orange-400 font-bold uppercase text-[10px]">PENDING</p></div>
            </div>
            <div class="space-y-4">
                <div class="w-full aspect-video rounded-3xl overflow-hidden bg-black/20 border border-white/10 flex items-center justify-center relative">
                    <img id="sImg" class="w-full h-full object-cover hidden">
                    <p id="sPl" class="text-[10px] opacity-20 uppercase font-bold">Tiada Gambar</p>
                </div>
                <button onclick="document.getElementById('fIn').click()" class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-all">PILIH FAIL</button>
                <button onclick="hUp()" class="btn-prime w-full p-4 rounded-2xl text-[10px] font-bold uppercase"><i class="fa-solid fa-upload mr-2"></i>MUAT NAIK</button>
                <input type="file" id="fIn" hidden accept="image/*" onchange="pImg(this)">
            </div>
        </div>
    </div>

    <div id="lecturerDash" class="glass w-full max-w-6xl p-8 hidden-section">
        <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-5 font-bold text-indigo-400 italic">
            <h2><i class="fa-solid fa-chalkboard-teacher mr-2"></i>LECTURER_PORTAL</h2>
            <button onclick="logout()" class="px-5 py-2 border border-white/10 rounded-full text-[10px]">LOGOUT</button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 text-sm">
            <div class="lg:col-span-4 h-[550px] overflow-y-auto custom-scroll pr-3" id="sList"></div>
            <div id="gradingPanel" class="lg:col-span-8 bg-white/5 border border-white/10 rounded-[2.5rem] p-10 hidden">
                <div class="flex items-center gap-6 mb-10 bg-white/5 p-5 rounded-3xl">
                    <img id="li" class="w-24 h-32 object-cover rounded-xl border border-white/20 shadow-xl">
                    <div>
                        <h3 id="ln" class="text-xl font-bold tracking-tight">--</h3>
                        <p id="lk" class="text-[10px] font-mono text-indigo-400 uppercase tracking-widest mt-1">--</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-6">
                    <div class="space-y-4 p-5 bg-white/5 rounded-2xl border border-white/10">
                        <h4 class="text-[11px] font-black text-indigo-400 uppercase border-b border-white/10 pb-2 text-center">HPK1 (40%)</h4>
                        <input type="number" id="h1" placeholder="HP1 (30)" oninput="calc()" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none">
                        <input type="number" id="h5" placeholder="HP5 (10)" oninput="calc()" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none">
                    </div>
                    <div class="space-y-4 p-5 bg-white/5 rounded-2xl border border-white/10">
                        <h4 class="text-[11px] font-black text-indigo-400 uppercase border-b border-white/10 pb-2 text-center">HPK2 (60%)</h4>
                        <input type="number" id="h8" placeholder="HP8 (30)" oninput="calc()" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none">
                        <input type="number" id="h10" placeholder="HP10 (30)" oninput="calc()" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none">
                    </div>
                </div>
                <div class="flex justify-between items-center bg-indigo-600/20 p-8 rounded-3xl border border-indigo-500/30 mb-8">
                    <div><p class="text-[10px] font-black uppercase opacity-40">Markah & Gred</p><p id="tm" class="text-5xl font-black text-indigo-400">0.0</p></div>
                    <p id="gd" class="text-6xl font-black text-indigo-400">F</p>
                </div>
                <div id="justArea" class="hidden mb-8 space-y-3">
                    <p class="text-[11px] font-bold text-red-400 uppercase tracking-widest"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Justifikasi A+ Mandatori</p>
                    <textarea id="justTxt" oninput="validate()" rows="3" placeholder="Ulasan A+..." class="w-full bg-red-500/5 border border-red-500/20 p-4 rounded-xl outline-none focus:border-red-500 transition-all"></textarea>
                </div>
                <button onclick="save()" id="saveBtn" class="btn-prime w-full p-5 rounded-3xl font-extrabold uppercase shadow-2xl tracking-widest">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i>SIMPAN MARKAH
                </button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxufZgAB9OWBbVzGzBascudDu498uJB80q9PtWDAFWLzDCZD5MxYqGKvIRyC38JgkId1Q/exec";
        let mode = 'student', sData = [], curS = null;

        function setType(t) {
            mode = t;
            document.getElementById('ts').classList.toggle('bg-indigo-600', t === 'student');
            document.getElementById('tl').classList.toggle('bg-indigo-600', t === 'lecturer');
            document.getElementById('pwGroup').classList.toggle('hidden', t === 'student');
        }

        async function handleAuth() {
            const btn = document.getElementById('loginBtn'), id = document.getElementById('idIn').value, pw = document.getElementById('pwIn').value;
            if(!id) return alert("Sila masukkan No. KP atau Emel!");
            
            const btText = document.getElementById('btTxt');
            btText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>VERIFYING...';
            btn.disabled = true;

            try {
                if (mode === 'student') {
                    const r = await fetch(`${API}?action=checkLogin&noKP=${id}`);
                    const o = await r.json();
                    if(o.status === "success") { 
                        localStorage.setItem('userMPU', JSON.stringify(o.data)); 
                        rS(o.data); 
                    } else alert(o.message);
                } else {
                    const r = await fetch(`${API}?action=lecturerLogin&email=${id}&pass=${pw}`);
                    const o = await r.json();
                    if(o.status === "success") { 
                        localStorage.setItem('le', id); 
                        iL(id); 
                    } else if(o.status === "new_user") {
                        document.getElementById('loginScreen').classList.add('hidden-section');
                        document.getElementById('regScreen').classList.remove('hidden-section');
                    } else alert(o.message);
                }
            } catch(e) { alert("API Error. Sila semak deployment!"); }
            btn.disabled = false; btText.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i>MASUK SISTEM';
        }

        function rS(d) {
            document.getElementById('loginScreen').classList.add('hidden-section');
            document.getElementById('studentDash').classList.remove('hidden-section');
            document.getElementById('sN').textContent = d.Nama_Pelajar; 
            document.getElementById('sK').textContent = d.No_KP; 
            document.getElementById('sC').textContent = d.Kelas;
            if(d.Status_Upload === "Selesai") {
                document.getElementById('sS').textContent = "✓ SELESAI"; 
                document.getElementById('sS').className = "text-green-400 font-bold uppercase text-[10px]";
                if(d.Link_Gambar) { 
                    const img = document.getElementById('sImg');
                    img.src = d.Link_Gambar; 
                    img.classList.remove('hidden'); 
                    document.getElementById('sPl').classList.add('hidden'); 
                }
            }
        }

        async function iL(em) {
            document.getElementById('loginScreen').classList.add('hidden-section');
            document.getElementById('lecturerDash').classList.remove('hidden-section');
            const r = await fetch(`${API}?action=getLecturerStudents&email=${em}`);
            const o = await r.json();
            sData = o.data;
            document.getElementById('sList').innerHTML = sData.map(s => `
                <div onclick="sel('${s.No_KP}')" class="p-5 bg-white/5 border border-white/10 rounded-2xl mb-4 cursor-pointer hover:bg-indigo-500/20 transition-all">
                    <p class="font-bold text-sm text-indigo-100">${s.Nama_Pelajar}</p>
                    <p class="text-[9px] opacity-40 uppercase font-mono tracking-widest mt-1">${s.Kelas} | KP: ${s.No_KP}</p>
                </div>
            `).join('');
        }

        function sel(kp) {
            curS = sData.find(s => s.No_KP == kp);
            document.getElementById('gradingPanel').classList.remove('hidden');
            document.getElementById('ln').textContent = curS.Nama_Pelajar;
            document.getElementById('lk').textContent = `KP: ${curS.No_KP} | ${curS.Kelas}`;
            document.getElementById('li').src = curS.Link_Gambar || "https://via.placeholder.com/150";
            
            if(curS.markahSediaAda) {
                document.getElementById('h1').value = curS.markahSediaAda.hp1;
                document.getElementById('h5').value = curS.markahSediaAda.hp5;
                document.getElementById('h8').value = curS.markahSediaAda.hp8;
                document.getElementById('h10').value = curS.markahSediaAda.hp10;
                document.getElementById('justTxt').value = curS.markahSediaAda.just === "-" ? "" : curS.markahSediaAda.just;
            } else { ['h1','h5','h8','h10','justTxt'].forEach(i => document.getElementById(i).value = ''); }
            calc();
        }

        function calc() {
            const h = [Number(document.getElementById('h1').value), Number(document.getElementById('h5').value), Number(document.getElementById('h8').value), Number(document.getElementById('h10').value)];
            const t = h.reduce((a, b) => a + b, 0); document.getElementById('tm').textContent = t.toFixed(1);
            let g = "F"; if (t >= 90) g = "A+"; else if (t >= 80) g = "A"; else if (t >= 75) g = "A-"; else if (t >= 70) g = "B+"; else if (t >= 65) g = "B"; else if (t >= 60) g = "B-"; else if (t >= 55) g = "C+"; else if (t >= 50) g = "C"; else if (t >= 40) g = "C-"; else if (t >= 30) g = "D+"; else if (t >= 20) g = "D";
            document.getElementById('gd').textContent = g;
            document.getElementById('justArea').classList.toggle('hidden', g !== "A+");
            validate();
        }

        function validate() {
            const g = document.getElementById('gd').textContent, j = document.getElementById('justTxt').value.trim();
            document.getElementById('saveBtn').disabled = (g === "A+" && j === "");
        }

        async function save() {
            const b = document.getElementById('saveBtn'); b.disabled = true; b.textContent = "SEDANG MENYIMPAN...";
            const p = { action: "submitScores", noKP: curS.No_KP, hp1: Number(document.getElementById('h1').value), hp5: Number(document.getElementById('h5').value), hp8: Number(document.getElementById('h8').value), hp10: Number(document.getElementById('h10').value), justifikasi: document.getElementById('justTxt').value, penilai: localStorage.getItem('le') };
            await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) });
            alert("MARKAH BERJAYA DISIMPAN!");
            const r = await fetch(`${API}?action=getLecturerStudents&email=${localStorage.getItem('le')}`);
            const o = await r.json(); sData = o.data;
            b.disabled = false; b.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-2"></i>SIMPAN MARKAH';
        }

        async function hUp() {
            const f = document.getElementById('fIn'); if(!f.files[0]) return alert("Pilih fail!");
            const u = JSON.parse(localStorage.getItem('userMPU')), r = new FileReader();
            r.onload = async (e) => {
                const p = { action: "uploadImage", noKP: u.No_KP.toString(), imageData: e.target.result.split(',')[1], mimeType: f.files[0].type, fileName: "MPU3221_" + u.No_KP };
                await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) });
                alert("BERJAYA!"); location.reload();
            }; r.readAsDataURL(f.files[0]);
        }

        function pImg(i) { if(i.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('sImg').src = e.target.result; document.getElementById('sImg').classList.remove('hidden'); document.getElementById('sPl').classList.add('hidden'); }; r.readAsDataURL(i.files[0]); } }
        async function doReg() { const p = { action: "registerLecturer", email: document.getElementById('idIn').value, nama: document.getElementById('rn').value, pass: document.getElementById('rp').value }; await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) }); alert("BERJAYA!"); location.reload(); }
        function logout() { localStorage.clear(); location.reload(); }
        window.onload = () => { 
            const u = localStorage.getItem('userMPU'); if(u) rS(JSON.parse(u));
            const le = localStorage.getItem('le'); if(le) iL(le);
        }
    </script>
</body>
</html>
