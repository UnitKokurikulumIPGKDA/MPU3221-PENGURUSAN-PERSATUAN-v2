<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal MPU3221 | Glassmorphism</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .btn-prime {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-prime:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
        }
        .hidden-section { display: none; }
        
        /* Animasi masuk */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-4">

    <div id="loginScreen" class="glass w-full max-w-md p-10 fade-in">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tighter uppercase mb-2">Portal MPU3221</h1>
            <p class="text-indigo-300/60 text-xs font-bold tracking-[0.2em] uppercase text-center w-full">Sistem Pemarkahan Persatuan</p>
        </div>
        <div class="space-y-6">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest mb-3 ml-1 opacity-50">No. Kad Pengenalan</label>
                <input type="text" id="noKP" maxlength="12" placeholder="Sila Masukkan 12 Digit" 
                       class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:outline-none focus:border-indigo-500 font-mono text-lg transition-all">
            </div>
            <button onclick="handleLogin()" id="loginBtn" class="btn-prime w-full p-4 rounded-2xl font-bold uppercase tracking-widest text-sm">
                Authenticate Access
            </button>
            <p id="loginError" class="text-red-400 text-center text-xs font-bold hidden bg-red-500/10 p-3 rounded-xl border border-red-500/20"></p>
        </div>
    </div>

    <div id="dashScreen" class="glass w-full max-w-4xl p-8 hidden-section fade-in">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-white/5 pb-6 gap-4">
            <div>
                <h2 class="text-2xl font-bold italic tracking-tight">Student_Dashboard</h2>
                <p id="sysID" class="text-[10px] font-mono text-indigo-400 mt-1 uppercase opacity-70">ID: --</p>
            </div>
            <button onclick="logout()" class="px-6 py-2 border border-white/10 rounded-full text-[10px] font-black uppercase hover:bg-red-500/20 transition-all tracking-widest">Logout Session</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="bg-white/5 border border-white/5 rounded-[2rem] p-8">
                <h3 class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-8 border-b border-white/5 pb-2">Digital Profile</h3>
                <div class="space-y-6">
                    <div>
                        <p class="text-[9px] uppercase opacity-40 font-bold tracking-widest">Nama Penuh Pelajar</p>
                        <p id="dN" class="text-xl font-semibold tracking-tight mt-1">--</p>
                    </div>
                    <div>
                        <p class="text-[9px] uppercase opacity-40 font-bold tracking-widest">Identification No.</p>
                        <p id="dK" class="font-mono text-indigo-200 text-lg">--</p>
                    </div>
                    <div class="flex gap-12">
                        <div>
                            <p class="text-[9px] uppercase opacity-40 font-bold tracking-widest">Kelas</p>
                            <p id="dC" class="font-bold text-lg">--</p>
                        </div>
                        <div>
                            <p class="text-[9px] uppercase opacity-40 font-bold tracking-widest">Status</p>
                            <p id="dS" class="text-orange-400 font-black">PENDING</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-5">
                <div id="imgContainer" class="w-full aspect-[4/3] rounded-[2rem] overflow-hidden bg-black/40 border border-white/10 flex items-center justify-center relative group">
                    <p id="placeholder" class="text-[10px] font-bold uppercase opacity-30 tracking-[0.2em]">No Evidence Detected</p>
                    <img id="liveImg" class="w-full h-full object-cover hidden transition-transform duration-500 group-hover:scale-105">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="document.getElementById('fIn').click()" class="bg-white/5 hover:bg-white/10 p-4 rounded-2xl text-[10px] font-bold uppercase tracking-widest border border-white/5 transition-all">Pilih Fail</button>
                    <button id="upBtn" onclick="handleUpload()" class="btn-prime p-4 rounded-2xl text-[10px] font-bold uppercase tracking-widest">Muat Naik</button>
                </div>
                <input type="file" id="fIn" hidden accept="image/*" onchange="preview(this)">
                <p id="upMsg" class="text-[9px] text-center uppercase opacity-50 font-bold tracking-widest"></p>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxPEHF9kU-b7NwdizFSpylKpQZ0ZNZFE-UyGzonUjcTRdv_MEHLnhxjBmQW69BcjCXOzw/exec";

        // Logik Log Masuk
        async function handleLogin() {
            const kp = document.getElementById('noKP').value;
            if(kp.length < 12) {
                showError("Sila masukkan 12 digit No. KP.");
                return;
            }
            const btn = document.getElementById('loginBtn');
            btn.textContent = "VERIFYING ACCESS..."; btn.disabled = true;

            try {
                const res = await fetch(`${API}?action=checkLogin&noKP=${kp}`);
                const out = await res.json();
                if(out.status === "success") {
                    localStorage.setItem('userMPU', JSON.stringify(out.data));
                    renderDash(out.data);
                } else {
                    showError(out.message);
                    btn.textContent = "Authenticate Access"; btn.disabled = false;
                }
            } catch(e) { 
                showError("Sambungan gagal. Pastikan API URL betul."); 
                btn.disabled = false; 
                btn.textContent = "Authenticate Access";
            }
        }

        // Papar Dashboard
        function renderDash(data) {
            document.getElementById('loginScreen').classList.add('hidden-section');
            document.getElementById('dashScreen').classList.remove('hidden-section');
            document.getElementById('dN').textContent = data.Nama_Pelajar;
            document.getElementById('dK').textContent = data.No_KP;
            document.getElementById('dC').textContent = data.Kelas;
            document.getElementById('sysID').textContent = "ID: " + (data.ID_SISTEM || "MPU3221_STUDENT");

            if(data.Status_Upload === "Selesai") {
                const st = document.getElementById('dS');
                st.textContent = "COMPLETED";
                st.className = "text-green-400 font-black tracking-widest";
                
                if(data.Link_Gambar) {
                    const img = document.getElementById('liveImg');
                    // Format pautan untuk paparan live
                    img.src = data.Link_Gambar;
                    img.classList.remove('hidden');
                    document.getElementById('placeholder').classList.add('hidden');
                }
            }
        }

        // Preview sebelum muat naik
        function preview(input) {
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById('liveImg');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('placeholder').classList.add('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Muat Naik Fail
        async function handleUpload() {
            const fIn = document.getElementById('fIn');
            const user = JSON.parse(localStorage.getItem('userMPU'));
            if(!fIn.files[0]) return alert("Sila pilih gambar terlebih dahulu!");
            
            const btn = document.getElementById('upBtn');
            const msg = document.getElementById('upMsg');
            btn.disabled = true; btn.textContent = "Processing...";
            msg.textContent = "Sedang menghantar ke server...";

            const reader = new FileReader();
            reader.onload = async (e) => {
                const payload = {
                    action: "uploadImage",
                    noKP: user.No_KP.toString(),
                    imageData: e.target.result.split(',')[1],
                    mimeType: fIn.files[0].type,
                    fileName: "MPU3221_" + user.No_KP
                };
                try {
                    // Gunakan mode no-cors untuk kestabilan Google Apps Script POST
                    await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    msg.textContent = "MUAT NAIK BERJAYA! SILA LOG MASUK SEMULA UNTUK UPDATE GAMBAR.";
                    msg.classList.replace('opacity-50', 'text-green-400');
                    btn.textContent = "SUCCESS";
                } catch(err) { 
                    alert("Gagal muat naik!"); 
                    btn.disabled = false; 
                    btn.textContent = "Muat Naik";
                }
            };
            reader.readAsDataURL(fIn.files[0]);
        }

        function showError(msg) {
            const err = document.getElementById('loginError');
            err.textContent = "ERR_SYSTEM: " + msg;
            err.classList.remove('hidden');
        }

        function logout() { 
            localStorage.removeItem('userMPU'); 
            location.reload(); 
        }

        // Kekalkan sesi jika sudah log masuk
        window.onload = () => {
            const u = localStorage.getItem('userMPU');
            if(u) renderDash(JSON.parse(u));
        }
    </script>
</body>
</html>
